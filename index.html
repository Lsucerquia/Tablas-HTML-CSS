<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica de tablas</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <main>
        <h1>Práctica de tablas en HTML</h1>
        <a href="horario.html">Ver horario</a>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <tr>
                        <td>Ana</td>
                        <td>4.5</td>
                    </tr>
                    <tr>
                        <td>Carlos</td>
                        <td>3.8</td>
                    </tr>
                </table>

            </div>

        </section>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <tr>
                        <th>Aprendiz</th>
                        <th>Nota</th>
                    </tr>
                    <tr>
                        <td>Ana</td>
                        <td>4.5</td>
                    </tr>
                </table>
            </div>

        </section>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Teclado</td>
                            <td class="numero">$85.000</td>
                        </tr>
                        <tr>
                            <td>Mouse</td>
                            <td class="numero">$40.000</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td>Total</td>
                            <td class="numero">$125.000</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <caption>
                        Notas del primer trimestre
                    </caption>
                    <thead>
                        <tr>
                            <th>Aprendiz</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Ana</td>
                            <td>4.5</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <tr>
                        <th colspan="2">Datos personales</th>
                        <th>Ficha</th>
                    </tr>
                    <tr>
                        <td>Ana</td>
                        <td>Gómez</td>
                        <td>2875432</td>
                    </tr>
                </table>
            </div>
        </section>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <tr>
                        <th rowspan="2">Lunes</th>
                        <td>7:00 a.m</td>
                        <td>HTML</td>
                    </tr>
                    <tr>
                        <!--no se escribe lunes porque ya ocupa esat fila-->
                        <td>9:00 a.m</td>
                        <td>CSS</td>
                    </tr>
                </table>
            </div>
        </section>

        <section>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Aprendiz</th>
                            <th scope="col">Nota</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <th scope="row">Ana</th>
                            <td>4.5</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
